<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#261447"/><stop offset="0.6" stop-color="#0b132b"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="190" cy="90" r="260" fill="#ffd166" opacity=".22"/><circle cx="1080" cy="130" r="240" fill="#06d6a0" opacity=".14"/>
  <text x="95" y="90" font-family="system-ui,Segoe UI,Arial" font-size="58" font-weight="900" fill="#fff7df">⛪ Name That Pope!</text>
  <text x="100" y="128" font-family="system-ui,Segoe UI,Arial" font-size="20" font-weight="700" fill="#cbd5e1">A ridiculous Vatican quiz show with holy combos, fake relics, and aggressively specific trivia.</text>
  <g transform="translate(210 170)" filter="url(#s)">
    <rect width="860" height="430" rx="32" fill="#0f172a" opacity=".82" stroke="#fff" stroke-opacity=".15"/>
    <text x="430" y="92" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="50" font-weight="900" fill="#fff7df">Welcome, contestant.</text>
    <text x="430" y="138" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="22" fill="#d5deef">Choose a mode and start the conclave.</text>
    <g font-family="system-ui,Segoe UI,Arial" text-anchor="middle">
      <rect x="84" y="190" width="210" height="110" rx="22" fill="#000" opacity=".25" stroke="#ffd166" stroke-width="3"/>
      <text x="189" y="232" font-size="34">😇</text><text x="189" y="267" font-size="22" font-weight="900" fill="#fff7df">Sunday School</text>
      <rect x="325" y="190" width="210" height="110" rx="22" fill="#000" opacity=".25" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
      <text x="430" y="232" font-size="34">🕊️</text><text x="430" y="267" font-size="22" font-weight="900" fill="#fff7df">Papal Panic</text>
      <rect x="566" y="190" width="210" height="110" rx="22" fill="#000" opacity=".25" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
      <text x="671" y="232" font-size="34">🏆</text><text x="671" y="267" font-size="22" font-weight="900" fill="#fff7df">Endless</text>
      <rect x="302" y="340" width="256" height="58" rx="16" fill="#06d6a0"/><text x="430" y="378" font-size="20" font-weight="900" fill="#1f2937">Start The Conclave</text>
    </g>
  </g>
